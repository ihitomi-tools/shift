<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>でっかい時計</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden}
body{font-family:"M PLUS Rounded 1c","BIZ UDPGothic","BIZ UDゴシック",sans-serif; user-select:none; -webkit-user-select:none}
svg{display:block}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ===== 配色（黒地に水色: 薄暗い部屋でもはっきり読める） ===== */
#app{
  --bg:#000; --text:#00e5ff; --sub:#00e5ff; --panel:#111; --line:#00e5ff;
  --accent:#00e5ff; --accent-text:#000; --danger:#ff7b7b;
  --cat:#14101c; --rim:rgba(0,229,255,.45); --catH:min(15cqh,14cqw);
}
#app{height:100dvh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display:flex; flex-direction:column; background:var(--bg); color:var(--text); transition:background .6s}
#stage{flex:1; min-height:0; position:relative; container-type:size; overflow:hidden}
.view{position:absolute; inset:0; display:none}
#app[data-view="clock"] #v-clock,#app[data-view="sw"] #v-sw,#app[data-view="tm"] #v-tm{display:block}

/* ===== 時計（iframe） ===== */
#tapzone{position:absolute; inset:0; z-index:2; touch-action:manipulation}
#face-frame{position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#000}

/* ===== ストップウォッチ / タイマー ===== */
.vwrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:0 3cqw; overflow:auto}
.vcard{position:relative; width:min(100%,780px); margin:var(--catH) 0 0; text-align:center; background:var(--panel); border:3px solid var(--line); border-radius:min(5cqw,28px); padding:min(2.5cqh,18px) 12px min(3cqh,20px); box-shadow:0 6px 0 var(--line)}
.vcard .big{font-size:min(19cqw,25cqh); font-weight:800; line-height:1.05; letter-spacing:.02em; font-variant-numeric:tabular-nums; margin:.05em 0}
.setrow{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:center}
.setter{display:flex; align-items:center; gap:6px; font-size:1.1rem; font-weight:700}
.setter input{width:3.8em; font:inherit; font-size:1.4rem; text-align:center; padding:4px; border:2px solid var(--line); border-radius:10px; background:transparent; color:var(--text)}
.presets{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.chip{font:inherit; font-weight:700; border:2px solid var(--line); background:transparent; color:var(--text); border-radius:99px; padding:8px 14px; cursor:pointer}
.controls{display:flex; gap:12px; justify-content:center; margin:min(2.4cqh,16px) 0 0; flex-wrap:wrap}
.btn{font:inherit; font-weight:800; font-size:1.15rem; min-width:128px; padding:12px 20px; border-radius:14px; border:3px solid var(--line); background:transparent; color:var(--text); cursor:pointer; box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent); color:var(--accent-text)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4; cursor:default}
.laps{list-style:none; margin:10px auto 0; padding:0; max-height:min(14cqh,120px); overflow:auto; text-align:left; border-top:2px solid var(--line)}
.laps li{display:flex; justify-content:space-between; gap:8px; padding:6px 4px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.hint{color:var(--sub); font-size:.85rem; margin-top:8px}
.done .big{color:var(--danger)}
.catslot svg.cat{position:absolute; left:7%; bottom:calc(100% - 3px); height:var(--catH); aspect-ratio:2/1; overflow:visible; filter:drop-shadow(0 0 1.2px var(--rim))}
.catslot svg.tail{position:absolute; right:16%; bottom:calc(100% - 4px); height:var(--catH); aspect-ratio:6/7; overflow:visible; transform-origin:50% 100%; animation:wag 2.2s ease-in-out infinite alternate; filter:drop-shadow(0 0 1.2px var(--rim))}
.catslot .cb{fill:var(--cat)}.catslot .ei2{fill:#ff8fb8}.catslot .wh{stroke:#ff8fb8}.catslot .tl{stroke:var(--cat)}
.catslot .eyes{transform-box:fill-box; transform-origin:center; animation:blink 5s infinite}

/* ===== 下のバー ===== */
nav{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:6px 8px; background:var(--panel); border-top:2px solid var(--line); z-index:5; backdrop-filter:blur(6px)}
.tabs{display:flex; flex:1 1 300px; gap:4px}
.tabs button{flex:1}
.tools{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; flex:1 1 auto; margin-left:auto}
nav button{font-weight:700; font-size:.85rem; color:var(--text); background:transparent; border:2px solid transparent; border-radius:10px; padding:8px 10px; min-height:40px; cursor:pointer; white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent); color:var(--accent-text)}
.tools button{border-color:var(--line)}
.tools button:disabled{opacity:.4}
nav.hide{display:none}

/* ===== アニメーション ===== */
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@media (prefers-reduced-motion: reduce){
  .catslot svg.tail,.catslot .eyes{animation:none}
}
@media (orientation:landscape) and (max-height:620px){
  nav{padding-top:3px; padding-bottom:3px}
  nav button{min-height:34px; padding:5px 10px}
}
/* ===== 設定画面 / メニューの案内 ===== */
#app{position:relative}
#hint{position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 12px); transform:translateX(-50%); z-index:6; pointer-events:none; white-space:nowrap;
  background:rgba(0,0,0,.8); color:var(--text); border:2px solid var(--line); border-radius:99px; padding:8px 18px; font-weight:700; font-size:.95rem}
@media (orientation: portrait){#hint{bottom:auto; top:calc(env(safe-area-inset-top) + 10px)}}
#dlg{color-scheme:dark; background:var(--panel); color:var(--text); border:3px solid var(--line); border-radius:20px; padding:16px 20px; width:min(92vw,460px); max-height:92dvh; overflow:auto; font-family:inherit}
#dlg::backdrop{background:rgba(0,0,0,.75)}
#dlg h2{margin:0 0 10px; font-size:1.15rem}
#dlg .opt{display:flex; align-items:center; gap:10px; padding:9px 0; font-size:1.05rem; font-weight:700}
#dlg input[type=radio]{width:1.4em; height:1.4em; accent-color:var(--accent); flex:none}
#dlg .times{display:flex; align-items:center; gap:10px; padding:2px 0 8px 2.4em; font-size:1.4rem; font-weight:700}
#dlg .times.off{opacity:.35}
#dlg input[type=time]{font:inherit; font-size:1.5rem; font-weight:700; color:var(--text); background:transparent; border:2px solid var(--line); border-radius:10px; padding:4px 8px; min-width:7.2em}
#dlg .note{margin:6px 0 12px; color:var(--sub); font-size:.85rem; line-height:1.5}
#dlg .btn{width:100%}
#dlg .ver{margin:8px 0 0; text-align:center; color:var(--sub); font-size:.75rem}
#dlg .times{flex-wrap:wrap}
@media (orientation: landscape) and (max-height: 520px){
  #dlg{padding:10px 16px; max-height:96dvh}
  #dlg h2{margin-bottom:2px; font-size:1rem}
  #dlg .opt{padding:4px 0; font-size:.95rem}
  #dlg .times{padding:0 0 4px 2.4em; gap:6px; font-size:1.1rem}
  #dlg input[type=time]{font-size:1.15rem; min-width:0; padding:2px 6px}
  #dlg .note{display:none}
  #dlg .btn{padding:8px 16px; font-size:1rem; margin-top:4px}
}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="paw" viewBox="0 0 64 64"><ellipse cx="32" cy="42" rx="14" ry="11"/><ellipse cx="13" cy="28" rx="6" ry="8"/><ellipse cx="25" cy="17" rx="6" ry="8"/><ellipse cx="39" cy="17" rx="6" ry="8"/><ellipse cx="51" cy="28" rx="6" ry="8"/></symbol>
</defs></svg>

<div id="app" data-view="clock">
<main id="stage">
  <section class="view" id="v-clock" aria-label="現在時刻">

    <!-- 時計のデザイン3種（Gemini版をそのまま別ページ化したもの）を切り替えて表示 -->
    <iframe id="face-frame" title="時計" src="big.html"></iframe>
    <div id="tapzone" aria-hidden="true"></div>
  </section>

  <section class="view" id="v-sw" aria-label="ストップウォッチ"><div class="vwrap"><div class="vcard">
    <div class="catslot"></div>
    <div class="big" id="sw">00:00.00</div>
    <div class="controls">
      <button class="btn primary" id="sw-start">スタート</button>
      <button class="btn" id="sw-lap" disabled>ラップ</button>
      <button class="btn danger" id="sw-reset" disabled>リセット</button>
    </div>
    <ol class="laps" id="laps" reversed></ol>
  </div></div></section>

  <section class="view" id="v-tm" aria-label="タイマー"><div class="vwrap"><div class="vcard" id="tm-card">
    <div class="catslot"></div>
    <div class="big" id="tm">05:00</div>
    <div class="setrow" id="tm-setrow">
      <div class="setter"><input id="tm-m" type="number" min="0" max="999" value="5" inputmode="numeric" aria-label="分">分<input id="tm-s" type="number" min="0" max="59" value="0" inputmode="numeric" aria-label="秒">秒</div>
      <div class="presets" id="presets"><button class="chip" data-s="60">1分</button><button class="chip" data-s="180">3分</button><button class="chip" data-s="300">5分</button><button class="chip" data-s="600">10分</button><button class="chip" data-s="1500">25分</button></div>
    </div>
    <div class="controls">
      <button class="btn primary" id="tm-start">スタート</button>
      <button class="btn danger" id="tm-reset">リセット</button>
    </div>
    <div class="hint">終わると音とバイブでお知らせ（画面は開いたままにしてね）</div>
  </div></div></section>
</main>

<nav>
  <div class="tabs" role="tablist" aria-label="モード">
    <button role="tab" data-v="clock" aria-selected="true">時計</button>
    <button role="tab" data-v="sw" aria-selected="false">ストップウォッチ</button>
    <button role="tab" data-v="tm" aria-selected="false">タイマー</button>
  </div>
  <div class="tools">
    <button id="b-sec" aria-label="秒の表示切り替え">秒</button>
    <button id="b-edge" aria-label="数字のふちどりの色を切り替え">ふち</button>
    <button id="b-fmt" aria-label="12時間/24時間の切り替え">24h</button>
    <button id="b-wake" aria-label="画面をつけておく時間の設定">点灯</button>
    <button id="b-fs" aria-label="全画面">全画面</button>
  </div>
</nav>
<div id="hint" hidden>画面をタップするとメニューが出ます</div>
<dialog id="dlg" aria-label="画面をつけておく設定">
  <form method="dialog">
    <h2>画面をつけておく設定</h2>
    <label class="opt"><input type="radio" name="wm" value="window"> 決めた時間だけ、つけておく</label>
    <div class="times" id="times"><input type="time" id="t-from" aria-label="開始時刻"> 〜 <input type="time" id="t-to" aria-label="終了時刻"></div>
    <label class="opt"><input type="radio" name="wm" value="always"> ずっと、つけておく</label>
    <label class="opt"><input type="radio" name="wm" value="off"> スマホの設定どおり（そのうち消える）</label>
    <p class="note">決めた時間より外では、スマホの自動ロックの時間で画面が消えます。ストップウォッチとタイマーが動いている間は、時間に関係なく消えません。</p>
    <button class="btn primary" value="close">とじる</button>
    <p class="ver">バージョン 16</p>
  </form>
</dialog>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const app = $('app');
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch {} }
  };
  const DJ = ['日','月','火','水','木','金','土'], DE = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  /* ---------- 状態 ---------- */
  const EDGE = ['none', 'white', 'pink', 'yellow', 'lime', 'orange', 'purple'];
  const EDGEL = { none: 'ふち:なし', white: 'ふち:白', pink: 'ふち:ピンク', yellow: 'ふち:黄', lime: 'ふち:ライム', orange: 'ふち:橙', purple: 'ふち:紫' };
  let edge = store.get('edge', 'none'); if (!EDGE.includes(edge)) edge = 'none';
  let secs = store.get('secs', '1') === '1', h12 = store.get('h12', '0') === '1', view = 'clock';

  function applyState(){
    app.dataset.view = view;
    $('b-sec').textContent = '秒:' + (secs ? 'あり' : 'なし');
    $('b-fmt').textContent = h12 ? '12h' : '24h';
    $('b-edge').textContent = EDGEL[edge];
    post(); navAwake();
  }
  // 時計ページへ、秒の表示と12/24時間を知らせる
  function post(){
    const w = $('face-frame').contentWindow;
    if (w) w.postMessage({ h12, secs, edge }, '*');
  }
  $('face-frame').addEventListener('load', post);

  /* ---------- 猫（ストップウォッチ/タイマー用） ---------- */
  const CAT = `<svg class="tail" viewBox="0 0 60 70" aria-hidden="true"><path class="tl" d="M30 70 C30 42 8 42 14 12" stroke-width="14" fill="none" stroke-linecap="round"/></svg>
  <svg class="cat" viewBox="0 0 200 100" aria-hidden="true"><g class="cb"><polygon points="48,56 54,6 96,34"/><polygon points="152,56 146,6 104,34"/><ellipse cx="100" cy="68" rx="60" ry="42"/><ellipse cx="62" cy="97" rx="22" ry="11"/><ellipse cx="138" cy="97" rx="22" ry="11"/></g>
  <polygon class="ei2" points="60,44 62,20 82,34"/><polygon class="ei2" points="140,44 138,20 118,34"/>
  <g class="eyes"><ellipse cx="78" cy="64" rx="11" ry="13" fill="#ffe14d"/><ellipse cx="122" cy="64" rx="11" ry="13" fill="#ffe14d"/><ellipse cx="78" cy="64" rx="3.5" ry="10" fill="#14101c"/><ellipse cx="122" cy="64" rx="3.5" ry="10" fill="#14101c"/><circle cx="82" cy="58" r="3" fill="#fff"/><circle cx="126" cy="58" r="3" fill="#fff"/></g>
  <polygon points="95,78 105,78 100,85" fill="#ff8fb8"/><path d="M100 85 q-6 7 -13 3 M100 85 q6 7 13 3" stroke="#ff8fb8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <g class="wh" stroke-width="2" stroke-linecap="round"><path d="M64 80 L30 74M64 85 L32 90M136 80 L170 74M136 85 L168 90"/></g></svg>`;
  document.querySelectorAll('.catslot').forEach(s => s.innerHTML = CAT);

  document.addEventListener('visibilitychange', () => syncWake());

  /* ---------- 切り替え ---------- */
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setView(b.dataset.v));
  function setView(v){
    view = v; app.dataset.view = v;
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.v === v));
    if (v === 'sw') swLoop();
    ['b-sec', 'b-edge', 'b-fmt'].forEach(id => $(id).style.display = v === 'clock' ? '' : 'none');  // 時計にだけ効くボタン
    navAwake();
  }
  // 時計を出している間は、操作バーを数秒で隠して時計だけにする（時計をタップするとまた出る）
  let navT = 0;
  const hint = $('hint');
  const nav = document.querySelector('nav');
  function navAwake(){
    nav.classList.remove('hide'); clearTimeout(navT);
    hint.hidden = true;
    if (view === 'clock') navT = setTimeout(() => {
      nav.classList.add('hide');
      if (store.get('menuSeen', '0') !== '1') hint.hidden = false;   // はじめて使う間だけ、タップするとメニューが出ることを知らせる
    }, 5000);
  }
  nav.addEventListener('pointerdown', navAwake);
  // 時計の上をタップしたらメニューを出す。時計ページへの伝言には頼らず、親のページ自身が受ける（指のタップは複数のイベントが出るので、どれでも反応させる）
  const reveal = () => { store.set('menuSeen', '1'); navAwake(); };
  ['pointerdown', 'touchstart', 'click'].forEach(t => $('tapzone').addEventListener(t, reveal, { passive: true }));
  addEventListener('message', e => { if (e.source === $('face-frame').contentWindow && e.data && e.data.type === 'tap') { store.set('menuSeen', '1'); navAwake(); } });
  $('b-edge').onclick = () => { edge = EDGE[(EDGE.indexOf(edge) + 1) % EDGE.length]; store.set('edge', edge); applyState(); };
  $('b-sec').onclick = () => { secs = !secs; store.set('secs', secs ? '1' : '0'); applyState(); };
  $('b-fmt').onclick = () => { h12 = !h12; store.set('h12', h12 ? '1' : '0'); applyState(); };
  if (document.documentElement.requestFullscreen) {
    $('b-fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  } else $('b-fs').style.display = 'none';

  /* ---------- 画面を消さない（既定は、勤務中の時間帯だけ） ---------- */
  const WAKE_MODES = ['window', 'always', 'off'];
  const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
  const hm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  let wakeFrom = toMin(store.get('wakeFrom', '15:00')) ?? 15 * 60;    // 既定: 15:00〜18:30（設定画面で変えられる）
  let wakeTo = toMin(store.get('wakeTo', '18:30')) ?? 18 * 60 + 30;
  let wakeMode = store.get('wake', 'window');
  if (!WAKE_MODES.includes(wakeMode)) wakeMode = 'window';
  let wake = null;
  const wakeLabel = () => wakeMode === 'window' ? `点灯 ${hm(wakeFrom)}-${hm(wakeTo)}` : wakeMode === 'always' ? '点灯:つけっぱなし' : '点灯:通常';
  // 開始 < 終了 なら同じ日の中、開始 > 終了 なら日またぎ（例 22:00〜06:00）、同じ時刻なら「なし」
  function inWakeWindow(){
    const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    if (wakeFrom === wakeTo) return false;
    return wakeFrom < wakeTo ? (m >= wakeFrom && m < wakeTo) : (m >= wakeFrom || m < wakeTo);
  }
  // ストップウォッチ・タイマーが動いている間は、時間帯に関係なく消さない
  const wantAwake = () => !document.hidden && (wakeMode === 'always' || (wakeMode === 'window' && inWakeWindow()) || tmRun || swRun);
  async function syncWake(){
    try {
      if (wantAwake()) {
        if (!wake && 'wakeLock' in navigator) {
          wake = await navigator.wakeLock.request('screen');
          wake.addEventListener('release', () => { wake = null; });
        }
      } else if (wake) { const w = wake; wake = null; await w.release(); }
    } catch {}
  }
  // 設定画面
  const dlg = $('dlg');
  function syncDlg(){
    document.querySelectorAll('input[name=wm]').forEach(r => { r.checked = r.value === wakeMode; });
    $('t-from').value = hm(wakeFrom); $('t-to').value = hm(wakeTo);
    $('times').classList.toggle('off', wakeMode !== 'window');
  }
  function saveWake(){
    const f = toMin($('t-from').value), t = toMin($('t-to').value);
    if (f !== null) { wakeFrom = f; store.set('wakeFrom', hm(f)); }
    if (t !== null) { wakeTo = t; store.set('wakeTo', hm(t)); }
    const r = document.querySelector('input[name=wm]:checked');
    if (r) { wakeMode = r.value; store.set('wake', wakeMode); }
    $('times').classList.toggle('off', wakeMode !== 'window');
    $('b-wake').textContent = wakeLabel(); syncWake();
  }
  $('b-wake').onclick = () => { syncDlg(); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); };
  dlg.addEventListener('input', saveWake); dlg.addEventListener('change', saveWake);
  document.addEventListener('pointerdown', syncWake, { once: true });   // 初回タップでも要求し直す（ブラウザによっては必要）
  setInterval(syncWake, 30000);                                          // 時間帯の開始・終了を拾う

  /* ---------- ストップウォッチ ---------- */
  let swRun = false, swBase = 0, swStart = 0, lapPrev = 0, lapN = 0;
  const swNow = () => swBase + (swRun ? performance.now() - swStart : 0);
  function fmtSw(ms){
    const t = Math.floor(ms / 10), cs = t % 100, s = Math.floor(t / 100) % 60, m = Math.floor(t / 6000);
    return (m >= 60 ? pad(Math.floor(m / 60)) + ':' + pad(m % 60) : pad(m)) + ':' + pad(s) + '.' + pad(cs);
  }
  function syncSw(){
    $('sw-start').textContent = swRun ? 'ストップ' : (swBase ? '再開' : 'スタート');
    $('sw-lap').disabled = !swRun; $('sw-reset').disabled = swRun || !swBase;
  }
  function swLoop(){
    $('sw').textContent = fmtSw(swNow());
    if (swRun && view === 'sw') requestAnimationFrame(swLoop);
  }
  $('sw-start').onclick = () => {
    if (swRun) { swBase += performance.now() - swStart; swRun = false; }
    else { swStart = performance.now(); swRun = true; }
    syncSw(); swLoop();
  };
  $('sw-lap').onclick = () => {
    const t = swNow(); lapN++;
    const li = document.createElement('li');
    li.innerHTML = `<span>ラップ ${lapN}</span><span>+${fmtSw(t - lapPrev)}</span><span>${fmtSw(t)}</span>`;
    $('laps').prepend(li); lapPrev = t;
  };
  $('sw-reset').onclick = () => { swBase = 0; lapPrev = 0; lapN = 0; $('laps').innerHTML = ''; $('sw').textContent = '00:00.00'; syncSw(); };

  /* ---------- タイマー ---------- */
  let tmRun = false, tmEnd = 0, tmLeft = 300000, tmTotal = 300000, audio = null, alarmT = null, tmT = null;
  function fmtTm(ms){
    const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    return (h ? pad(h) + ':' : '') + pad(h ? m : Math.floor(s / 60)) + ':' + pad(s % 60);
  }
  function readInputs(){
    const m = Math.max(0, Math.min(999, parseInt($('tm-m').value) || 0));
    const s = Math.max(0, Math.min(59, parseInt($('tm-s').value) || 0));
    return (m * 60 + s) * 1000;
  }
  function setTimer(ms){
    tmTotal = tmLeft = ms;
    $('tm-m').value = Math.floor(ms / 60000); $('tm-s').value = Math.floor(ms / 1000) % 60;
    $('tm').textContent = fmtTm(ms);
  }
  function beep(){
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.3);
    if (navigator.vibrate) navigator.vibrate(200);
  }
  function stopAlarm(){ clearInterval(alarmT); alarmT = null; $('tm-card').classList.remove('done'); }
  function syncTm(){
    $('tm-start').textContent = tmRun ? '一時停止' : (alarmT ? 'とめる' : (tmLeft < tmTotal ? '再開' : 'スタート'));
    $('tm-setrow').style.display = (tmRun || tmLeft < tmTotal) ? 'none' : '';
  }
  function tmTick(){
    const left = tmEnd - Date.now();
    if (left <= 0) finishTimer(); else $('tm').textContent = fmtTm(left);
  }
  $('tm-start').onclick = () => {
    if (alarmT) { stopAlarm(); setTimer(tmTotal); syncTm(); return; }
    if (tmRun) { tmLeft = Math.max(0, tmEnd - Date.now()); tmRun = false; clearInterval(tmT); }
    else {
      if (tmLeft === tmTotal) setTimer(readInputs());
      if (tmLeft <= 0) return;
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      tmEnd = Date.now() + tmLeft; tmRun = true; tmT = setInterval(tmTick, 200);
    }
    syncTm();
  };
  $('tm-reset').onclick = () => { stopAlarm(); tmRun = false; clearInterval(tmT); setTimer(tmTotal); syncTm(); };
  $('presets').onclick = e => { const s = e.target.dataset.s; if (s) setTimer(s * 1000); };
  ['tm-m','tm-s'].forEach(id => $(id).oninput = () => { if (!tmRun) setTimer(readInputs()); });
  function finishTimer(){
    tmRun = false; clearInterval(tmT); tmLeft = 0; $('tm').textContent = '00:00';
    $('tm-card').classList.add('done'); beep();
    let n = 0; alarmT = setInterval(() => { beep(); if (++n >= 30) { stopAlarm(); setTimer(tmTotal); syncTm(); } }, 800);
    syncTm();
  }

  /* ---------- 起動 ---------- */
  setTimer(300000); syncSw(); syncTm(); applyState(); $('b-wake').textContent = wakeLabel(); syncWake();
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;   // 初回インストールのときは開き直さない
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloaded || tmRun || swRun) return;   // タイマー/ストップウォッチが動いている間は邪魔しない
      reloaded = true; location.reload();                         // 新しい版に切り替わったので、開き直して最新にする
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>

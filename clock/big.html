<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>でっかい時計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@700&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0; height:100%; overflow:hidden; background:#000}
canvas{display:block; position:absolute; inset:0}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="時計"></canvas>
<script>
(() => {
  // 文字を画面いっぱいに描く時計。canvasに描くので、どんな画面でも文字の大きさをぴったり計算できる
  const FALL = '"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
  // 数字は Barlow Condensed（太字）。日付の漢字はBarlowに無いので、BIZ UDゴシックで描く
  const WEIGHT = 800, FAMILY = 'Barlow Condensed';
  // 色: 黒地に水色（コントラスト比 約13.6:1）
  const BG = '#000000', FG = '#00e5ff';
  const DJ = ['日','月','火','水','木','金','土'];
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
  let secs = get('secs', '1') === '1', h12 = get('h12', '0') === '1';
  let W = 0, H = 0, timer = 0;

  const spec = px => `${WEIGHT} ${px}px "${FAMILY}","BIZ UDGothic","BIZ UDPGothic",${FALL}`;

  function resize(){
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // 数字の「いちばん広い幅」と高さ、コロンの幅。この幅のマスに1文字ずつ置くので、数字が変わっても位置がずれない
  function metrics(){
    ctx.font = spec(100);
    let dw = 0, asc = 0;
    for (const ch of '0123456789') {
      const t = ctx.measureText(ch);
      dw = Math.max(dw, t.width / 100); asc = Math.max(asc, (t.actualBoundingBoxAscent || 72) / 100);
    }
    return { dw, asc, colon: ctx.measureText(':').width / 100 };
  }
  // 1文字ずつ、同じ幅のマスの真ん中に描く
  function drawCells(str, cx, y, fs, m){
    const cw = ch => (ch === ':' ? m.colon : m.dw) * fs;
    let x = cx - [...str].reduce((a, ch) => a + cw(ch), 0) / 2;
    ctx.textAlign = 'center';
    for (const ch of str) { ctx.fillText(ch, x + cw(ch) / 2, y); x += cw(ch); }
  }

  function draw(){
    clearTimeout(timer);
    const now = new Date(), h = now.getHours();
    const hh = String(h12 ? (h % 12 || 12) : h).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const date = (h12 ? (h < 12 ? '午前 ' : '午後 ') : '') + `${now.getMonth() + 1}月${now.getDate()}日（${DJ[now.getDay()]}）`;
    const m = metrics(), wide = W / H >= 1.15, pad = Math.min(W, H) * 0.035;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FG; ctx.textBaseline = 'alphabetic';

    // 日付・秒の行を、幅に収まる最大の大きさにする
    const fitRow = (maxFs, parts, maxW) => {
      ctx.font = spec(maxFs);
      const w = parts.reduce((a, t) => a + ctx.measureText(t).width, 0) + maxFs * 0.8 * (parts.length - 1);
      return w > maxW ? maxFs * maxW / w : maxFs;
    };

    if (wide) {
      // 横長: 「12:34」を1行で最大に。下に日付と秒
      const rowH = H * 0.17, gapY = H * 0.04, avail = H - pad * 2 - rowH - gapY;
      const fs = Math.min(0.97 * W / (4 * m.dw + m.colon), avail / m.asc);
      ctx.font = spec(fs);
      drawCells(`${hh}:${mm}`, W / 2, pad + avail / 2 + m.asc * fs / 2, fs, m);
      const parts = secs ? [date, ss + '秒'] : [date];
      const fs2 = fitRow(rowH * 0.78, parts, W * 0.94), base = H - pad - rowH / 2 + fs2 * 0.36;
      ctx.font = spec(fs2);
      if (secs) {
        ctx.textAlign = 'left';  ctx.fillText(date, W * 0.03, base);
        ctx.textAlign = 'right'; ctx.fillText(ss + '秒', W * 0.97, base);
      } else { ctx.textAlign = 'center'; ctx.fillText(date, W / 2, base); }
    } else {
      // 縦長: 「12」の下に「34」を積んで最大に。下に日付と秒
      const lines = secs ? 2 : 1, rowH = H * 0.055, gap = 0.14;
      const gapY = H * 0.03, avail = H - pad * 2 - lines * rowH * 1.35 - gapY;
      const fs = Math.min(0.94 * W / (2 * m.dw), avail / (2 * m.asc + gap));
      const block = (2 * m.asc + gap) * fs, top = pad + (avail - block) / 2;
      ctx.font = spec(fs);
      drawCells(hh, W / 2, top + m.asc * fs, fs, m);
      drawCells(mm, W / 2, top + (2 * m.asc + gap) * fs, fs, m);
      const fsD = fitRow(rowH, [date], W * 0.94);
      ctx.font = spec(fsD); ctx.textAlign = 'center';
      let y = pad + avail + gapY + rowH;
      ctx.fillText(date, W / 2, y);
      if (secs) { y += rowH * 1.35; ctx.fillText(ss + '秒', W / 2, y); }
    }
    cv.setAttribute('aria-label', `${h}時${now.getMinutes()}分`);
    timer = setTimeout(draw, 1000 - (Date.now() % 1000) + 15);
  }

  // フォントが読み込めたら、もう一度ぴったり描き直す
  function loadFonts(){
    if (!(document.fonts && document.fonts.load)) return;
    document.fonts.load(`${WEIGHT} 100px "${FAMILY}"`, '0123456789:秒').then(draw).catch(() => {});
    document.fonts.load('700 100px "BIZ UDGothic"', '月日（）火水木金土曜午前後秒0123456789').then(draw).catch(() => {});
  }

  addEventListener('resize', () => { resize(); draw(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) draw(); });
  // 親の時計アプリから、秒の表示と12/24時間の指定を受け取る
  addEventListener('message', e => {
    const d = e.data || {};
    if (typeof d.secs === 'boolean') secs = d.secs;
    if (typeof d.h12 === 'boolean') h12 = d.h12;
    draw();
  });
  // タップしたら、親に操作バーを出してもらう
  addEventListener('pointerdown', () => { try { parent.postMessage({ type: 'tap' }, '*'); } catch {} });

  resize(); draw(); loadFonts();
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>でっかい時計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@700&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0; height:100%; overflow:hidden; background:#000}
canvas{display:block; position:absolute; inset:0}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="時計"></canvas>
<script>
(() => {
  // 文字を画面いっぱいに描く時計。canvasに描くので、どんな画面でも文字の大きさをぴったり計算できる
  const FALL = '"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
  // 数字は Barlow Condensed（太字）。日付の漢字はBarlowに無いので、BIZ UDゴシックで描く
  const WEIGHT = 800, FAMILY = 'Barlow Condensed';
  // 色: 黒地に水色（コントラスト比 約13.6:1）
  const BG = '#000000', FG = '#00e5ff';
  const DJ = ['日','月','火','水','木','金','土'];
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
  // 数字のふちどりの色（なし = ふちどりなし）
  const EDGE_COLORS = { none: null, white: '#ffffff', pink: '#ff3dcb', yellow: '#ffe600', lime: '#39ff14', orange: '#ff8a00', purple: '#b44cff' };
  let secs = get('secs', '1') === '1', h12 = get('h12', '0') === '1', edge = get('edge', 'none');
  if (!(edge in EDGE_COLORS)) edge = 'none';
  let W = 0, H = 0, timer = 0;

  const spec = px => `${WEIGHT} ${px}px "${FAMILY}","BIZ UDGothic","BIZ UDPGothic",${FALL}`;

  function resize(){
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // 数字は「実際に見えている幅」で測って、文字どうしの余白を詰める（その分、数字を大きくできる）
  const GAP = 0.07;   // 数字と数字のすき間（文字の高さに対する割合ではなく、フォントサイズに対する割合）
  const MAX_STRETCH = 1.3;   // 横長の画面で、数字を縦に伸ばして余白を埋める上限（1.3 = 最大30%）
  function metrics(){
    ctx.font = spec(100); ctx.textAlign = 'left';   // 前の描画の文字寄せが残っていると測り方がずれるので、必ず左寄せで測る
    let inkW = 0, asc = 0; const off = {};
    for (const ch of '0123456789') {
      const t = ctx.measureText(ch), l = t.actualBoundingBoxLeft || 0, r = t.actualBoundingBoxRight || t.width;
      inkW = Math.max(inkW, (l + r) / 100); asc = Math.max(asc, (t.actualBoundingBoxAscent || 72) / 100);
      off[ch] = ((r - l) / 2 - t.width / 2) / 100;   // 見えている部分の中心が、文字の送り幅の中心からどれだけずれているか（em）
    }
    const c = ctx.measureText(':'), cl = c.actualBoundingBoxLeft || 0, cr = c.actualBoundingBoxRight || c.width;
    off[':'] = ((cr - cl) / 2 - c.width / 2) / 100;
    return { dw: inkW + GAP, asc, colon: (cl + cr) / 100 + GAP * 1.4, off };
  }
  // 文字を描く。ふちどりの色が決まっていれば、文字の外側に細い線を足す（textAlign は呼ぶ側で設定済み）
  function put(str, x, y, fs){
    const col = EDGE_COLORS[edge];
    if (col) {
      ctx.lineJoin = 'round'; ctx.miterLimit = 2;
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, fs * 0.01) * 2;   // 文字の内側は塗りつぶしで隠れるので、外側に半分だけ見える
      ctx.strokeText(str, x, y);
    }
    ctx.fillText(str, x, y);
  }
  // 1文字ずつ、同じ幅のマスの真ん中に（見えている部分が中央に来るように）描く。sy>1 なら縦に伸ばす
  function drawCells(str, cx, y, fs, m, sy = 1){
    const cw = ch => (ch === ':' ? m.colon : m.dw) * fs;
    let x = cx - [...str].reduce((a, ch) => a + cw(ch), 0) / 2;
    ctx.save(); ctx.translate(0, y); ctx.scale(1, sy); ctx.textAlign = 'center';
    for (const ch of str) { put(ch, x + cw(ch) / 2 - m.off[ch] * fs, 0, fs); x += cw(ch); }
    ctx.restore();
  }

  function draw(){
    clearTimeout(timer);
    const now = new Date(), h = now.getHours();
    const hh = String(h12 ? (h % 12 || 12) : h).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const ampm = h12 ? (h < 12 ? 'AM' : 'PM') : '';   // 午前/午後より見間違えにくい
    const date = `${now.getMonth() + 1}月${now.getDate()}日（${DJ[now.getDay()]}）`;
    const m = metrics(), wide = W / H >= 1.15, pad = Math.min(W, H) * 0.03;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FG; ctx.textBaseline = 'alphabetic';

    // 日付・秒の行を、幅に収まる最大の大きさにする
    const fitRow = (maxFs, parts, maxW) => {
      ctx.font = spec(maxFs);
      const w = parts.reduce((a, t) => a + ctx.measureText(t).width, 0) + maxFs * 0.8 * (parts.length - 1);
      return w > maxW ? maxFs * maxW / w : maxFs;
    };

    if (wide) {
      // 横長: 「12:34」を1行で最大に（横幅いっぱい。縦が余ったら数字を縦に伸ばす）。下に日付と秒
      const rowH = H * (secs ? 0.15 : 0.12), gapY = H * 0.035, apH = ampm ? H * 0.14 : 0, avail = H - pad * 2 - rowH - gapY - apH;
      const fsW = 0.99 * W / (4 * m.dw + m.colon), fs = Math.min(fsW, avail / m.asc);
      const sy = fs === fsW ? Math.max(1, Math.min(MAX_STRETCH, avail / (m.asc * fs))) : 1;
      ctx.font = spec(fs);
      if (ampm) { const fa = apH * 0.66; ctx.font = spec(fa); ctx.textAlign = 'left'; put(ampm, W * 0.02, pad + apH * 0.7, fa); ctx.font = spec(fs); }
      drawCells(`${hh}:${mm}`, W / 2, pad + apH + avail / 2 + m.asc * fs * sy / 2, fs, m, sy);
      const parts = secs ? [date, ss + '秒'] : [date];
      const fs2 = fitRow(rowH * 0.8, parts, W * 0.96), base = H - pad - rowH / 2 + fs2 * 0.36;
      ctx.font = spec(fs2);
      if (secs) {
        ctx.textAlign = 'left';  put(date, W * 0.02, base, fs2);
        ctx.textAlign = 'right'; put(ss + '秒', W * 0.98, base, fs2);
      } else { ctx.textAlign = 'center'; put(date, W / 2, base, fs2); }
    } else {
      // 縦長: 「12」の下に「34」を積んで最大に。下に日付と秒
      const lines = secs ? 2 : 1, rowH = H * 0.055, gap = 0.14;
      const gapY = H * 0.03, apH = ampm ? H * 0.06 : 0, avail = H - pad * 2 - lines * rowH * 1.35 - gapY - apH;
      const fs = Math.min(0.94 * W / (2 * m.dw), avail / (2 * m.asc + gap));
      const block = (2 * m.asc + gap) * fs, top = pad + apH + (avail - block) / 2;
      if (ampm) { const fa = apH * 0.66; ctx.font = spec(fa); ctx.textAlign = 'left'; put(ampm, W * 0.04, pad + apH * 0.7, fa); }
      ctx.font = spec(fs);
      drawCells(hh, W / 2, top + m.asc * fs, fs, m);
      drawCells(mm, W / 2, top + (2 * m.asc + gap) * fs, fs, m);
      const fsD = fitRow(rowH, [date], W * 0.94);
      ctx.font = spec(fsD); ctx.textAlign = 'center';
      let y = pad + apH + avail + gapY + rowH;
      put(date, W / 2, y, fsD);
      if (secs) { y += rowH * 1.35; put(ss + '秒', W / 2, y, fsD); }
    }
    cv.setAttribute('aria-label', `${h}時${now.getMinutes()}分`);
    // 秒を出すときは毎秒、出さないときは1分ごとに描き直す（電池のため）
    timer = setTimeout(draw, secs ? 1000 - (Date.now() % 1000) + 15 : 60000 - (Date.now() % 60000) + 50);
  }

  // フォントが読み込めたら、もう一度ぴったり描き直す
  function loadFonts(){
    if (!(document.fonts && document.fonts.load)) return;
    document.fonts.load(`${WEIGHT} 100px "${FAMILY}"`, '0123456789:秒').then(draw).catch(() => {});
    document.fonts.load('700 100px "BIZ UDGothic"', '月日（）火水木金土曜午前後秒0123456789').then(draw).catch(() => {});
  }

  addEventListener('resize', () => { resize(); draw(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) draw(); });
  // 親の時計アプリから、秒の表示と12/24時間の指定を受け取る
  addEventListener('message', e => {
    const d = e.data || {};
    if (typeof d.secs === 'boolean') secs = d.secs;
    if (typeof d.h12 === 'boolean') h12 = d.h12;
    if (d.edge in EDGE_COLORS) edge = d.edge;
    draw();
  });
  // タップしたら、親に操作バーを出してもらう
  addEventListener('pointerdown', () => { try { parent.postMessage({ type: 'tap' }, '*'); } catch {} });

  resize(); draw(); loadFonts();
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>

/* ここからデザイン元のCSS（そのまま） */
html,body{height:100%; margin:0; overflow:hidden; background:#26211E}
body{font-family:'M PLUS Rounded 1c', sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent}
.font-flip{font-family:'Share Tech Mono','M PLUS Rounded 1c',monospace}
.flip-card{box-shadow:0 12px 25px -5px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.1)}
@keyframes flipBounce{0%{transform:scaleY(1)}30%{transform:scaleY(.85)}100%{transform:scaleY(1)}}
.flip-anim{animation:flipBounce .35s ease-out}
/* 画面の大きさに合わせて拡大縮小（元デザインは19.5:9の横画面） */
#canvas{position:absolute; left:50%; top:50%; width:800px; height:369px; transform-origin:center}

<body>
<div id="canvas">
            <div id="design-3" class="w-full h-full relative bg-[#26211E] text-[#F5EBE6] flex flex-col items-center justify-between p-4 sm:p-7 overflow-hidden">
                <div class="w-full flex items-center justify-between px-4 text-xs sm:text-sm font-flip tracking-widest text-[#A6968C]">
                    <div class="flex items-center gap-2">
                        <span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                        <span>NEKO-FLIP CLOCK</span>
                    </div>
                    <div id="d3-date">2026-10-25 SUN</div>
                </div>
                <div id="d3-cat-paw" style="transform:translateY(-28px)" class="absolute -top-36 right-[22%] sm:right-[26%] z-30 transition-transform duration-300 ease-in-out pointer-events-none">
                    <svg class="w-20 h-36 sm:w-28 sm:h-44 drop-shadow-[0_8px_15px_rgba(0,0,0,0.6)]" viewBox="0 0 100 170">
                        <rect x="28" y="0" width="44" height="115" fill="#E5DCD3"/>
                        <path d="M 28 25 H 45 M 28 45 H 48 M 72 35 H 55" stroke="#8C7A6B" stroke-width="6" stroke-linecap="round"/>
                        <circle cx="50" cy="115" r="26" fill="#FFFFFF"/>
                        <ellipse cx="50" cy="120" rx="11" ry="9" fill="#F48FB1"/>
                        <circle cx="35" cy="105" r="5.5" fill="#F48FB1"/>
                        <circle cx="45" cy="99" r="5.5" fill="#F48FB1"/>
                        <circle cx="56" cy="99" r="5.5" fill="#F48FB1"/>
                        <circle cx="65" cy="105" r="5.5" fill="#F48FB1"/>
                    </svg>
                </div>
                <div class="flex items-center justify-center gap-4 sm:gap-8 my-auto pt-3">
                    <div class="relative">
                        <svg class="w-10 h-8 sm:w-14 sm:h-10 absolute -top-6 sm:-top-8 left-4 text-[#38302C]" viewBox="0 0 60 45" fill="currentColor"><path d="M 5 45 L 15 5 Q 18 0 23 4 L 55 45 Z"/><polygon points="15,40 20,14 42,40" fill="#4E423D"/></svg>
                        <svg class="w-10 h-8 sm:w-14 sm:h-10 absolute -top-6 sm:-top-8 right-4 text-[#38302C] scale-x-[-1]" viewBox="0 0 60 45" fill="currentColor"><path d="M 5 45 L 15 5 Q 18 0 23 4 L 55 45 Z"/><polygon points="15,40 20,14 42,40" fill="#4E423D"/></svg>
                        <div id="d3-card-h" class="flip-card relative w-32 h-32 sm:w-52 sm:h-48 bg-[#38302C] rounded-2xl sm:rounded-3xl border border-[#4E423D] flex items-center justify-center overflow-hidden">
                            <div class="w-full h-[2px] sm:h-[3px] bg-[#1F1A17] absolute top-1/2 left-0 z-20 shadow-sm"></div>
                            <div class="w-1.5 h-4 sm:w-2 sm:h-6 bg-[#181412] absolute top-1/2 -translate-y-1/2 left-0 z-20 rounded-r"></div>
                            <div class="w-1.5 h-4 sm:w-2 sm:h-6 bg-[#181412] absolute top-1/2 -translate-y-1/2 right-0 z-20 rounded-l"></div>
                            <span id="d3-ampm" class="absolute top-2.5 left-3.5 text-[10px] sm:text-xs font-flip text-amber-400/80 tracking-wider">PM</span>
                            <span id="d3-hours" class="font-flip text-7xl sm:text-9xl font-bold text-[#F5EBE6] tracking-tighter select-none">18</span>
                        </div>
                    </div>
                    <div class="relative">
                        <svg class="w-10 h-8 sm:w-14 sm:h-10 absolute -top-6 sm:-top-8 left-4 text-[#38302C]" viewBox="0 0 60 45" fill="currentColor"><path d="M 5 45 L 15 5 Q 18 0 23 4 L 55 45 Z"/><polygon points="15,40 20,14 42,40" fill="#4E423D"/></svg>
                        <svg class="w-10 h-8 sm:w-14 sm:h-10 absolute -top-6 sm:-top-8 right-4 text-[#38302C] scale-x-[-1]" viewBox="0 0 60 45" fill="currentColor"><path d="M 5 45 L 15 5 Q 18 0 23 4 L 55 45 Z"/><polygon points="15,40 20,14 42,40" fill="#4E423D"/></svg>
                        <div id="d3-card-m" class="flip-card cursor-pointer relative w-32 h-32 sm:w-52 sm:h-48 bg-[#38302C] rounded-2xl sm:rounded-3xl border border-[#4E423D] flex items-center justify-center overflow-hidden group">
                            <div class="w-full h-[2px] sm:h-[3px] bg-[#1F1A17] absolute top-1/2 left-0 z-20 shadow-sm"></div>
                            <div class="w-1.5 h-4 sm:w-2 sm:h-6 bg-[#181412] absolute top-1/2 -translate-y-1/2 left-0 z-20 rounded-r"></div>
                            <div class="w-1.5 h-4 sm:w-2 sm:h-6 bg-[#181412] absolute top-1/2 -translate-y-1/2 right-0 z-20 rounded-l"></div>
                            <span class="absolute bottom-2 right-3 text-xs sm:text-sm opacity-20 group-hover:opacity-50 transition-opacity">🐾</span>
                            <span id="d3-minutes" class="font-flip text-7xl sm:text-9xl font-bold text-[#F5EBE6] tracking-tighter select-none">49</span>
                        </div>
                    </div>
                </div>
                <div class="w-full flex items-center justify-between bg-[#1B1715] px-5 py-2 rounded-xl border border-[#38302C]">
                    <div class="flex items-center gap-2 text-xs text-[#A6968C]">
                        <span>🐾 タップでねこの手</span>
                    </div>
                    <div class="flex items-center gap-2 font-flip text-amber-400">
                        <span class="text-xs text-[#A6968C]">SEC</span>
                        <span id="d3-sec" class="text-base sm:text-lg font-bold w-6 text-right">00</span>
                    </div>
                </div>
            </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const fit = () => {
    const s = Math.min(innerWidth / 800, innerHeight / 369);
    canvas.style.transform = `translate(-50%,-50%) scale(${s})`;
  };
  addEventListener('resize', fit); fit();

  const daysEn = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const h12 = () => { try { return localStorage.getItem('h12') === '1'; } catch { return false; } };
  let lastMinute = -1, busy = false;

  function setDigits(hStr, mStr){ $('d3-hours').textContent = hStr; $('d3-minutes').textContent = mStr; }

  // ねこの手がニュッと降りてきて、分パネルをパタッとめくる
  function playPaw(onHit){
    if (busy) { onHit && onHit(); return; }
    busy = true;
    const paw = $('d3-cat-paw'), card = $('d3-card-m');
    paw.style.transform = 'translateY(115px)';
    setTimeout(() => {
      card.classList.remove('flip-anim'); void card.offsetWidth; card.classList.add('flip-anim');
      onHit && onHit();
    }, 220);
    setTimeout(() => { paw.style.transform = 'translateY(-28px)'; busy = false; }, 520);
  }
  $('d3-card-m').addEventListener('click', () => playPaw());

  let timer = 0;
  function update(){
    clearTimeout(timer);
    const now = new Date(), h = now.getHours(), m = now.getMinutes();
    const hStr = String(h12() ? (h % 12 || 12) : h).padStart(2, '0'), mStr = String(m).padStart(2, '0');
    $('d3-sec').textContent = String(now.getSeconds()).padStart(2, '0');
    $('d3-ampm').textContent = h >= 12 ? 'PM' : 'AM';
    $('d3-date').textContent = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${daysEn[now.getDay()]}`;
    if (lastMinute !== -1 && lastMinute !== m && !document.hidden) playPaw(() => setDigits(hStr, mStr));
    else setDigits(hStr, mStr);
    lastMinute = m;
    timer = setTimeout(update, 1000 - (Date.now() % 1000) + 15);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });
  update();
})();
</script>
</body>
</html>

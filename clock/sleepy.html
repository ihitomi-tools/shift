/* ここからデザイン元のCSS */
html,body{height:100%; margin:0; overflow:hidden}
body{font-family:'M PLUS Rounded 1c', sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent}
#canvas{position:absolute; left:50%; top:50%; width:800px; height:369px; transform-origin:center}
html,body{background:#FFFDF7}
.font-fredoka{font-family:'Fredoka','M PLUS Rounded 1c',sans-serif}
@keyframes breathe{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.06) scaleX(1.02)}}
.cat-breathe{transform-origin:bottom center; animation:breathe 3.5s infinite ease-in-out}
@keyframes floatZzz{0%{opacity:0; transform:translate(0,0) scale(.6)}40%{opacity:.9}100%{opacity:0; transform:translate(18px,-28px) scale(1.2)}}
.zzz-1{animation:floatZzz 3s infinite linear}
.zzz-2{animation:floatZzz 3s infinite linear 1.5s}
@keyframes pawBatting{0%,100%{transform:rotate(0deg)}30%{transform:rotate(25deg) translateY(4px)}60%{transform:rotate(-5deg)}}
.paw-bat{transform-origin:top left; animation:pawBatting 2s infinite ease-in-out}
#design-2{overflow:visible !important}
@media (prefers-reduced-motion: reduce){.cat-breathe,.zzz-1,.zzz-2,.paw-bat,.animate-bounce{animation:none}}
</style>

<body>
<div id="canvas">
  <div id="design-2" class="w-full h-full relative transition-colors duration-500 bg-[#FFFDF7] text-[#4A3F35] flex flex-col items-center justify-center overflow-hidden">
    <div class="absolute -top-12 -left-12 w-40 h-40 rounded-full bg-amber-200/30 pointer-events-none"></div>
    <div class="absolute -bottom-16 -right-12 w-52 h-52 rounded-full bg-orange-200/30 pointer-events-none"></div>
    <div class="flex items-center gap-3 mb-2 sm:mb-4 bg-[#F3ECE1] px-4 py-1.5 rounded-full shadow-sm">
      <span class="text-xs sm:text-sm font-bold tracking-widest text-[#7A6A58]" id="d2-date">10月25日 (日)</span>
      <span class="text-stone-300">|</span>
      <span id="d2-cat-status" class="text-xs sm:text-sm font-bold text-amber-700">💤 すやすや昼寝中</span>
    </div>
    <div class="relative flex items-center justify-center my-1 sm:my-2" style="margin-top:56px">
      <div class="relative">
        <div onclick="pokeSleepingCat()" class="cursor-pointer absolute -top-11 sm:-top-16 left-1/2 -translate-x-1/2 w-28 sm:w-40 z-20 group">
          <div id="d2-zzz" class="absolute -top-2 right-2 font-fredoka font-bold text-amber-600/80 pointer-events-none">
            <span class="zzz-1 inline-block text-xs sm:text-sm">Z</span>
            <span class="zzz-2 inline-block text-sm sm:text-base">z</span>
          </div>
          <div id="d2-nya" class="absolute -top-6 left-1/2 -translate-x-1/2 bg-amber-500 text-white text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full shadow opacity-0 transition-all duration-300 pointer-events-none whitespace-nowrap">ゴロゴロ…♪</div>
          <svg class="w-full h-auto overflow-visible cat-breathe drop-shadow-sm" viewBox="0 0 150 75">
            <path id="d2-cat-body" d="M 25 62 C 20 22, 95 18, 118 62 Z" fill="#F59E0B" class="transition-colors duration-300"/>
            <path id="d2-cat-stripe" d="M 60 28 Q 65 40 60 45 M 75 27 Q 80 40 75 46 M 90 31 Q 94 42 90 48" stroke="#B45309" stroke-width="4" stroke-linecap="round" fill="none"/>
            <circle id="d2-cat-head" cx="35" cy="48" r="20" fill="#F59E0B" class="transition-colors duration-300"/>
            <polygon id="d2-cat-ear1" points="18,36 14,15 32,29" fill="#F59E0B" class="transition-colors duration-300"/>
            <polygon id="d2-cat-ear2" points="38,31 46,13 53,34" fill="#F59E0B" class="transition-colors duration-300"/>
            <polygon points="19,33 17,20 29,29" fill="#FDE68A"/>
            <polygon points="40,30 45,18 50,32" fill="#FDE68A"/>
            <path id="d2-eye-l" d="M 23 48 Q 28 53 33 48" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path id="d2-eye-r" d="M 38 48 Q 43 53 48 48" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="21" cy="52" r="3" fill="#F87171" opacity="0.5"/>
            <circle cx="50" cy="52" r="3" fill="#F87171" opacity="0.5"/>
            <ellipse cx="20" cy="62" rx="8" ry="5" fill="#FFFBEB"/>
            <ellipse cx="48" cy="63" rx="8" ry="5" fill="#FFFBEB"/>
            <path id="d2-cat-tail" d="M 112 58 Q 135 60 132 82" stroke="#F59E0B" stroke-width="10" fill="none" stroke-linecap="round" class="transition-colors duration-300"/>
          </svg>
        </div>
        <div id="d2-hours" class="font-fredoka text-[5.5rem] sm:text-[8.5rem] md:text-[9.5rem] font-bold leading-none tracking-tight text-[#4A3F35] select-none">18</div>
      </div>
      <div class="relative mx-2 sm:mx-5 flex flex-col items-center justify-center gap-3 sm:gap-5">
        <svg class="w-10 h-10 sm:w-14 sm:h-14 absolute -top-7 sm:-top-10 -left-2 z-20 paw-bat pointer-events-none" viewBox="0 0 60 60">

        <div class="w-3.5 h-3.5 sm:w-5 sm:h-5 rounded-full bg-amber-500 animate-bounce"></div>

      </div>
      <div class="relative">

        <div class="absolute -bottom-2 -right-8 sm:-right-12 flex items-center bg-[#4A3F35] text-[#FFFDF7] px-2.5 py-1 rounded-full shadow-md">
          <span class="text-xs sm:text-sm mr-1">🐾</span>

      <span id="paw-step-1" class="text-sm sm:text-lg transition-opacity duration-300">🐾</span>
      <span id="paw-step-2" class="text-sm sm:text-lg transition-opacity duration-300 opacity-20">🐾</span>
      <span id="paw-step-3" class="text-sm sm:text-lg transition-opacity duration-300 opacity-20">🐾</span>
      <span id="paw-step-4" class="text-sm sm:text-lg transition-opacity duration-300 opacity-20">🐾</span>
      <span id="paw-step-5" class="text-sm sm:text-lg transition-opacity duration-300 opacity-20">🐾</span>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas');
function fit(){ const s = Math.min(innerWidth / 800, innerHeight / 369); canvas.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

let H12 = false; try { H12 = localStorage.getItem('h12') === '1'; } catch {}
const daysJa = ['日', '月', '火', '水', '木', '金', '土'];

function updateClocks() {
  const now = new Date(), hours = now.getHours(), seconds = now.getSeconds();
  $('d2-hours').textContent = String(H12 ? (hours % 12 || 12) : hours).padStart(2, '0');
  $('d2-minutes').textContent = String(now.getMinutes()).padStart(2, '0');
  $('d2-sec').textContent = String(seconds).padStart(2, '0');
  $('d2-date').textContent = `${now.getMonth() + 1}月${now.getDate()}日 (${daysJa[now.getDay()]})`;
  const activePaws = (seconds % 5) + 1;
  for (let i = 1; i <= 5; i++) {
    $(`paw-step-${i}`).classList.toggle('opacity-20', i > activePaws);
  }
  setTimeout(updateClocks, 1000 - (Date.now() % 1000) + 15);
}

function pokeSleepingCat() {
  const nya = $('d2-nya'), status = $('d2-cat-status');
  const phrases = ['ゴロゴロ…♪', 'むにゃ…🐾', 'にゃ〜ん♡', 'スヤァ…💤'];
  nya.textContent = phrases[Math.floor(Math.random() * phrases.length)];
  nya.style.opacity = '1';
  nya.style.transform = 'translate(-50%, -8px)';
  status.textContent = '🐾 ごきげんに喉を鳴らし中';
  setTimeout(() => { nya.style.opacity = '0'; nya.style.transform = 'translate(-50%, 0)'; }, 1400);
}

function setCatBreed(breed) {
  const parts = ['d2-cat-body', 'd2-cat-head', 'd2-cat-ear1', 'd2-cat-ear2'].map($);
  const tail = $('d2-cat-tail'), stripe = $('d2-cat-stripe'), paw = $('d2-paw'), bg = $('design-2');
  const eyes = [$('d2-eye-l'), $('d2-eye-r')];
  let mainColor = '#F59E0B', eye = '#4A3F35';
  if (breed === 'tabby') { mainColor = '#F59E0B'; stripe.style.opacity = '1'; bg.style.backgroundColor = '#FFFDF7'; }
  else if (breed === 'black') {
    mainColor = '#27272A'; stripe.style.opacity = '0'; bg.style.backgroundColor = '#F5F5F4';
    eye = '#F5F5F4'; // 元の色だと黒い毛の上で見えないので、寝顔の線だけ明るくする
  }
  else if (breed === 'calico') { mainColor = '#F3F4F6'; stripe.style.opacity = '0'; bg.style.backgroundColor = '#FFF5F5'; }
  else return;
  parts.forEach(el => el.setAttribute('fill', mainColor));
  // 白ねこは背景に溶けるので、うっすら輪郭をつける（元デザインにはない）
  const outline = breed === 'calico';
  parts.forEach(el => { if (outline) { el.setAttribute('stroke', '#C9B8AA'); el.setAttribute('stroke-width', '1.5'); } else { el.removeAttribute('stroke'); el.removeAttribute('stroke-width'); } });
  $('d2-cat-body').closest('svg').style.filter = outline ? 'drop-shadow(0 0 1px #8A7466)' : '';
  document.body.style.backgroundColor = bg.style.backgroundColor; // 画面の余白も同じ色に
  tail.setAttribute('stroke', mainColor);
  paw.setAttribute('stroke', mainColor);
  eyes.forEach(el => el.setAttribute('stroke', eye));
}

// 親の時計アプリから、毛色や12/24時間の指定を受け取る
addEventListener('message', e => {
  const d = e.data || {};
  if (typeof d.h12 === 'boolean') H12 = d.h12;
  if (typeof d.breed === 'string') setCatBreed(d.breed);
});

updateClocks();

</script>
</body>
</html>

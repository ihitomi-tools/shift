html,body{height:100%; margin:0; overflow:hidden}
body{font-family:'M PLUS Rounded 1c', sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent}
#canvas{position:absolute; left:50%; top:50%; width:800px; height:369px; transform-origin:center}
html,body{background:#0f172a}
.font-quicksand{font-family:'Quicksand','M PLUS Rounded 1c',sans-serif}
@keyframes tailWag{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.tail-wag{transform-origin:100px 185px; animation:tailWag 2s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2; transform:scale(.8)}50%{opacity:1; transform:scale(1.1)}}

<body>
<div id="canvas">
  <div id="design-1" class="w-full h-full relative transition-colors duration-1000 bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-900 flex flex-col justify-between overflow-hidden">
    <div id="d1-stars" class="absolute inset-0 pointer-events-none transition-opacity duration-1000 opacity-100">
      <div class="w-1.5 h-1.5 bg-white rounded-full absolute top-[15%] left-[15%] star-twinkle"></div>
      <div class="w-1 h-1 bg-amber-100 rounded-full absolute top-[28%] left-[35%] star-twinkle" style="animation-delay: 0.8s"></div>
      <div class="w-2 h-2 bg-white rounded-full absolute top-[18%] left-[72%] star-twinkle" style="animation-delay: 1.5s"></div>
      <div class="w-1 h-1 bg-white rounded-full absolute top-[42%] left-[82%] star-twinkle" style="animation-delay: 2.2s"></div>
      <div class="w-1.5 h-1.5 bg-blue-100 rounded-full absolute top-[12%] left-[52%] star-twinkle" style="animation-delay: 0.4s"></div>
      <div class="w-1 h-1 bg-white rounded-full absolute top-[35%] left-[18%] star-twinkle" style="animation-delay: 1.9s"></div>
      <svg class="w-10 h-10 sm:w-14 sm:h-14 absolute top-[12%] right-[14%] text-amber-100/90 drop-shadow-[0_0_12px_rgba(254,243,199,0.5)]" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </div>
    <div id="d1-sun" class="absolute inset-0 pointer-events-none transition-opacity duration-1000 opacity-0">
      <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-full bg-amber-200/40 blur-xl absolute top-[10%] right-[12%]"></div>
      <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-amber-100/80 absolute top-[14%] right-[15%] shadow-[0_0_30px_rgba(255,255,255,0.8)]"></div>
    </div>
    <div class="absolute inset-0 border-[12px] sm:border-[18px] border-slate-950/80 pointer-events-none z-10 flex">
      <div class="w-1/2 h-full border-r-[3px] border-slate-950/30"></div>
    </div>
    <div class="relative z-10 flex flex-col items-center justify-center pt-6 sm:pt-10 pointer-events-none">
      <div id="d1-date" class="font-quicksand text-xs sm:text-base tracking-[0.25em] text-amber-100/80 mb-0.5 sm:mb-1 drop-shadow">2026.10.25 SUN</div>
      <div id="d1-clock" class="flex items-baseline gap-2 sm:gap-3 text-white drop-shadow-[0_4px_20px_rgba(0,0,0,0.4)]">
        <span id="d1-time" class="font-quicksand text-6xl sm:text-8xl md:text-9xl font-bold tracking-wider leading-none">18:49</span>
        <span id="d1-sec" class="font-quicksand text-xl sm:text-3xl font-medium opacity-75 w-8 sm:w-12">00</span>
      </div>
    </div>
    <div class="relative z-20 w-full flex flex-col items-center">
      <div onclick="earTwitch()" class="cursor-pointer group relative -mb-3 sm:-mb-4 ml-20 sm:ml-40 transition-transform active:scale-95">
        <div id="d1-heart" class="absolute -top-4 left-1/2 -translate-x-1/2 text-pink-400 text-lg opacity-0 transition-all duration-500 pointer-events-none">♥</div>
        <svg class="w-28 h-28 sm:w-40 sm:h-40 overflow-visible drop-shadow-[0_-4px_10px_rgba(0,0,0,0.4)]" viewBox="0 0 200 220">
          <path d="M 65 185 C 55 135, 72 95, 100 95 C 128 95, 145 135, 135 185 Z" fill="#090d16"/>
          <circle cx="100" cy="72" r="27" fill="#090d16"/>
          <polygon id="d1-ear-l" points="75,58 68,26 94,47" fill="#090d16" class="transition-transform duration-150" style="transform-origin: 82px 52px;"/>
          <polygon id="d1-ear-r" points="125,58 132,26 106,47" fill="#090d16" class="transition-transform duration-150" style="transform-origin: 118px 52px;"/>
          <line x1="60" y1="70" x2="75" y2="72" stroke="#090d16" stroke-width="2" stroke-linecap="round"/>
          <line x1="58" y1="77" x2="75" y2="76" stroke="#090d16" stroke-width="2" stroke-linecap="round"/>
          <line x1="140" y1="70" x2="125" y2="72" stroke="#090d16" stroke-width="2" stroke-linecap="round"/>
          <line x1="142" y1="77" x2="125" y2="76" stroke="#090d16" stroke-width="2" stroke-linecap="round"/>

        <span>SILHOUETTE WINDOW</span>
        <span></span>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas');
function fit(){ const s = Math.min(innerWidth / 800, innerHeight / 369); canvas.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

let H12 = false; try { H12 = localStorage.getItem('h12') === '1'; } catch {}
const daysEn = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

function updateClocks() {
  const now = new Date(), hours = now.getHours();
  const hStr = String(H12 ? (hours % 12 || 12) : hours).padStart(2, '0');
  const mStr = String(now.getMinutes()).padStart(2, '0');
  const sStr = String(now.getSeconds()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0'), date = String(now.getDate()).padStart(2, '0');
  $('d1-time').textContent = `${hStr}:${mStr}`;
  $('d1-sec').textContent = sStr;
  $('d1-date').textContent = `${now.getFullYear()}.${month}.${date} ${daysEn[now.getDay()]}`;
  setTimeout(updateClocks, 1000 - (Date.now() % 1000) + 15);
}

function setSkyTheme(mode) {
  const bg = $('design-1'), stars = $('d1-stars'), sun = $('d1-sun'), clock = $('d1-clock'), date = $('d1-date');
  bg.className = "w-full h-full relative transition-colors duration-1000 flex flex-col justify-between overflow-hidden ";
  if (mode === 'day') {
    bg.classList.add('bg-gradient-to-b', 'from-sky-400', 'via-sky-300', 'to-amber-100');
    stars.style.opacity = '0'; sun.style.opacity = '1';
  } else if (mode === 'sunset') {
    bg.classList.add('bg-gradient-to-b', 'from-indigo-900', 'via-rose-500', 'to-amber-400');
    stars.style.opacity = '0.3'; sun.style.opacity = '1';
  } else {
    bg.classList.add('bg-gradient-to-b', 'from-indigo-950', 'via-purple-950', 'to-slate-900');
    stars.style.opacity = '1'; sun.style.opacity = '0';
  }
  // 昼は背景が明るいので文字を濃い色にする（元デザインは白のまま）
  clock.classList.toggle('text-white', mode !== 'day');
  clock.classList.toggle('text-sky-950', mode === 'day');
  date.classList.toggle('text-amber-100/80', mode !== 'day');
  date.classList.toggle('text-sky-950', mode === 'day');
}

function earTwitch() {
  const earL = $('d1-ear-l'), earR = $('d1-ear-r'), heart = $('d1-heart');
  earL.style.transform = 'rotate(-16deg)';
  earR.style.transform = 'rotate(14deg)';
  heart.style.opacity = '1';
  heart.style.transform = 'translate(-50%, -12px)';
  setTimeout(() => { earL.style.transform = 'rotate(0deg)'; earR.style.transform = 'rotate(0deg)'; }, 220);
  setTimeout(() => { heart.style.opacity = '0'; heart.style.transform = 'translate(-50%, 0)'; }, 900);
}

// 親の時計アプリから、空の色や12/24時間の指定を受け取る
addEventListener('message', e => {
  const d = e.data || {};
  if (typeof d.h12 === 'boolean') H12 = d.h12;
  if (['day', 'sunset', 'night'].includes(d.sky)) setSkyTheme(d.sky);
});

updateClocks();

</script>
</body>
</html>

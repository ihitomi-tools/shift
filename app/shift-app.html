<title>おしごと手帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 1画面ずつ切り替える、スマホ用の1列アプリ。上に見出し、中に内容、下に5つのタブ。内容は最大440pxの幅で中央に置く */
:root {
  --bg: #f4f6f9; --card: #ffffff; --fg: #1a2233; --sub: #6b7587; --line: #e1e6ee; --soft: #eef1f6;
  --pal1: #3257d6; --pal2: #d9432f; --pal3: #d9a400; --pal4: #5a8f1f; --pal5: #1ea0d6; --pal6: #8a4fd6; --pal7: #d6457a; --pal8: #8a5a3c;
  --me: #3257d6; --p1: #d6457a; --p2: #5a8f1f; --accent: #3257d6;
  --f1: #e08a1e; --f2: #1a9d8f; --f3: #7a5bd1;
  --warn: #a85a00; --warn-bg: #fff3dc; --ok: #1f8a57; --bad: #d9432f; --todo: #d9a400;
  --today-bg: #e6ecfd;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --head: "M PLUS Rounded 1c", "BIZ UDPGothic", "Hiragino Maru Gothic ProN", sans-serif;
  --fs: 16px; --r: 14px; --cloudmix: #000; --cat: #1d212b; --cat-eye: #0e9a5f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --card: #1b212b; --fg: #eaeef5; --sub: #9aa5b8; --line: #2a3340; --soft: #232b37;
    --warn: #f0a85a; --warn-bg: #33260f; --ok: #62c796; --cloudmix: #fff; color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg: #11151c; --card: #1b212b; --fg: #eaeef5; --sub: #9aa5b8; --line: #2a3340; --soft: #232b37; --warn: #f0a85a; --warn-bg: #33260f; --ok: #62c796; --cloudmix: #fff; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--fs); line-height: 1.55; }
symbol { overflow: visible; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--head); margin: 0; line-height: 1.35; }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
#view { flex: 1; padding: 8px 0 80px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--sub); cursor: pointer; min-height: 56px; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tab:focus-visible, .btn:focus-visible, .nav:focus-visible, .cell:focus-visible, .chipb:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.top h1 { font-size: 22px; flex: 1; min-width: 0; }
.top .sub { font-size: 13px; color: var(--sub); }
.nav { border: 0; background: var(--soft); width: 44px; height: 44px; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; color: var(--fg); flex: none; }
.btn { border: 2px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; padding: 12px 16px; border-radius: var(--r); min-height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { width: auto; min-height: 40px; padding: 6px 14px; font-size: .9em; }
.btn.danger { border-color: var(--bad); background: transparent; color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.card h3 { font-size: 1.05em; display: flex; align-items: center; gap: 8px; }
.sub { color: var(--sub); font-size: .88em; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.right { margin-left: auto; text-align: right; }
.empty { color: var(--sub); text-align: center; padding: 10px 0; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: .9em; }
.tag { display: inline-block; white-space: nowrap; font-size: .75em; font-weight: 700; padding: 0 8px; border-radius: 5px; background: var(--warn-bg); color: var(--warn); line-height: 1.6; }
.tag.me { background: var(--me); color: #fff; }
.fl { display: inline-block; font-weight: 800; font-size: .8em; line-height: 1.5; border-radius: 5px; color: #fff; padding: 0 6px; min-width: 28px; text-align: center; white-space: nowrap; }
.f1 { background: var(--f1); } .f2 { background: var(--f2); } .f3 { background: var(--f3); }
.ei, .ico { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ico { width: 1.1em; height: 1.1em; vertical-align: -.2em; margin-right: 4px; }

/* カレンダー */
.stage { position: relative; perspective: 1400px; }
.flip-in { display: grid; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.3,1.25,.4,1); }
.face { grid-area: 1 / 1; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; backface-visibility: hidden; -webkit-backface-visibility: hidden; min-width: 0; box-shadow: 0 1px 3px rgba(20,30,60,.08); }
.face.f1b { transform: rotateY(180deg); }
.shadow { height: 12px; margin: 2px 24px 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), transparent 70%); }
.plate { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; font-weight: 700; flex: none; }
.plate.me { background: var(--me); color: #fff; }
.plate.me .sub { color: #fff; opacity: .85; margin-left: auto; }
.plate.ov { background: var(--fg); color: var(--bg); }
.plate.todo { background: var(--todo); color: #3a2a00; }
.plate .sub { margin-left: auto; color: inherit; opacity: .8; font-weight: 400; }
.av3 { display: inline-flex; gap: 3px; } .av3 i { width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: auto; gap: 3px; text-align: center; }
.face > .cal { flex: 1; grid-template-rows: auto; grid-auto-rows: 1fr; }
.dow { font-size: .78em; color: var(--sub); padding: 2px 0; }
.dow.sun, .cell.sun .dn, .cell.hol .dn { color: #e0607a; } .dow.sat { color: #5a8fe0; }
.cell { border: 0; background: none; padding: 2px 0 3px; min-height: clamp(38px, calc((100dvh - 350px) / 6), 50px); border-radius: 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-size: .85em; min-width: 0; }
.cell.empty { cursor: default; }
.cell.work { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.cell .dn { width: 24px; line-height: 24px; text-align: center; border-radius: 50%; font-size: 1.05em; }
.cell.today { background: var(--today-bg); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.today .dn { background: var(--accent); color: #fff; font-weight: 800; }
.cell .fl { font-size: .78em; min-width: 26px; }
.cell .ap { display: flex; align-items: center; gap: 1px; font-size: .68em; line-height: 1.5; padding: 0 4px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); font-weight: 700; white-space: nowrap; }
.cell .ap.me { background: var(--me); color: #fff; }
.cell .ap .ei { width: 11px; height: 11px; }
.dots { display: flex; justify-content: center; gap: 2px; margin-top: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; }
.tk { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--tc); color: var(--tc); margin-top: 2px; }
.tk .ei { width: 13px; height: 13px; stroke-width: 2.4; }
.tk.over { --tc: var(--bad); background: var(--bad); color: #fff; } .tk.soon { --tc: var(--warn); } .tk.ok { --tc: var(--sub); }
.mi { font-size: .7em; color: var(--sub); }
.people { display: flex; gap: 6px; }
.pc { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 14px; border: 2px solid var(--pc); background: color-mix(in srgb, var(--pc) 15%, var(--card)); }
.pc.off { opacity: .6; border: 1px dashed var(--sub); background: transparent; }
.pc .av, .srow .av { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; }
.pc .av svg, .srow .av svg { width: 20px; height: 20px; fill: #fff; }
.pc .tx { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.pc b { font-size: .9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pc i { font-style: normal; font-size: .75em; color: var(--sub); white-space: nowrap; }

.house { gap: 0; } .house h3 { margin-bottom: 6px; flex-wrap: wrap; }
.roof { height: 40px; margin: 0 -2px -2px; background: color-mix(in srgb, var(--me) 55%, var(--card)); clip-path: polygon(50% 0, 100% 100%, 0 100%); position: relative; z-index: 1; }
.bld { display: grid; gap: 6px; padding: 10px 10px 0; border: 2px solid var(--fg); border-radius: 4px 4px 0 0; background: var(--soft); position: relative; }
.bld .door { justify-self: center; width: 44px; height: 26px; margin-top: 2px; border-radius: 8px 8px 0 0; background: color-mix(in srgb, var(--me) 55%, var(--card)); }
.house .sub { margin-top: 8px; }
.mcard { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; } .mcard select { width: 100%; min-height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); font: inherit; padding: 0 10px; }
.fixwk summary { cursor: pointer; color: var(--sub); font-size: .85em; text-align: center; padding: 8px; list-style: none; opacity: .8; } .fixwk summary::-webkit-details-marker { display: none; } .fixin { display: grid; gap: 12px; margin-top: 6px; }
.nmd summary { cursor: pointer; font-weight: 700; min-height: 28px; display: flex; align-items: center; } .nmd[open] summary { margin-bottom: 6px; } .nmrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; } .nmrow .role { min-width: 34px; } .nmrow input { flex: 1; min-width: 0; min-height: 40px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg); font: inherit; padding: 0 10px; }
.rdsum { display: flex; flex-wrap: wrap; gap: 6px; } .fix { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; } .thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #fff; } .thph { width: 96px; height: 96px; display: grid; place-items: center; border-radius: 10px; border: 1px dashed var(--line); font-size: .8em; color: var(--sub); }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; } [hidden] { display: none !important; }
.bld .fr { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1.35fr); gap: 6px; align-items: center; }
.pp { display: flex; align-items: baseline; gap: 5px; padding: 6px 8px; border-radius: 10px; background: var(--card); border: 1.5px solid var(--line); min-width: 0; }
.pp i { font-style: normal; font-size: .7em; color: var(--sub); flex: none; } .pp b { font-size: .88em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp.am { opacity: .8; } .pp.pm b { font-size: 1em; } .pp.empty b { color: var(--sub); font-weight: 400; }
.pp.me { background: color-mix(in srgb, var(--me) 20%, var(--card)); border-color: var(--me); opacity: 1; }
.pp.fr1 { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 14%, var(--card)); } .pp.fr2 { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 14%, var(--card)); }
.crw { display: flex; align-items: center; gap: 8px; padding: 2px 0; min-width: 0; }
.role { display: inline-block; white-space: nowrap; font-size: .75em; font-weight: 700; padding: 0 8px; border-radius: 5px; line-height: 1.7; min-width: 62px; text-align: center; background: var(--soft); color: var(--fg); border: 1px solid var(--line); }
.role.n { background: color-mix(in srgb, var(--p1) 16%, var(--card)); border-color: var(--p1); }
.logc summary { cursor: pointer; font-weight: 700; list-style: none; min-height: 28px; display: flex; align-items: center; color: var(--sub); } .logc summary::-webkit-details-marker { display: none; } .logc[open] summary { margin-bottom: 8px; }
.gearrow { display: flex; justify-content: center; } .gear { border: 0; background: none; color: var(--sub); font-size: .78em; padding: 6px 14px; cursor: pointer; opacity: .75; }
/* 猫(お休みの日) */
.thk2 .cat { position: absolute; left: calc(50% + 32px); bottom: 0; width: 36px; height: 34px; color: var(--cat); }
/* ダーク = ネオン */
html.dk { --cat: #f4f6ff; --cat-eye: #1a2030; --f1: #ffa31a; --f2: #19e6c1; --f3: #b78cff; --todo: #ffe14d; --bg: #0a0d14; --card: #141923; --line: #2b3446; --soft: #1d2433; --today-bg: #14203a; }
html.dk .btn:not(.ghost):not(.danger), html.dk .chipb[aria-pressed="true"], html.dk .tag.me, html.dk .plate.me, html.dk .cell.today .dn, html.dk .fl, html.dk .cell .ap.me { color: #0a0d14; }
html.dk .pc .av svg, html.dk .srow .av svg { fill: #0a0d14; }
html.dk .btn:not(.ghost):not(.danger), html.dk .plate.me, html.dk .chipb[aria-pressed="true"] { box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 70%, transparent); }
html.dk .plate.ov { background: transparent; color: var(--fg); border: 2px solid var(--fg); box-shadow: 0 0 10px rgba(255,255,255,.3); }
html.dk .plate.todo { box-shadow: 0 0 12px color-mix(in srgb, var(--todo) 70%, transparent); color: #1a1500; }
html.dk .cell.today { box-shadow: inset 0 0 0 2px var(--accent), 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent); }
html.dk .cell.today .dn { box-shadow: 0 0 10px var(--accent); }
html.dk .cell.work { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 25%, transparent); }
html.dk .f1 { box-shadow: 0 0 8px var(--f1); } html.dk .f2 { box-shadow: 0 0 8px var(--f2); } html.dk .f3 { box-shadow: 0 0 8px var(--f3); }
html.dk .pc { box-shadow: 0 0 10px color-mix(in srgb, var(--pc) 55%, transparent); }
html.dk .thk2 .cl > svg, html.dk .thk-p, html.dk .thk2 .cat { filter: drop-shadow(0 0 5px currentColor); }
html.dk .thk-p { color: var(--me); }
html.dk .tab[aria-current="page"] { text-shadow: 0 0 8px var(--accent); }
html.dk .tab[aria-current="page"] svg { filter: drop-shadow(0 0 4px var(--accent)); }
html.dk .av3 i { box-shadow: 0 0 6px currentColor; }

/* 考え事の雲 */
.thkwrap { display: flex; justify-content: center; min-height: 112px; }
.thk2 { --pc: var(--p1); position: relative; width: 300px; max-width: 100%; height: 108px; flex: none; }
.thk2 .thk-p { position: absolute; left: calc(50% - 17px); bottom: 0; width: 34px; height: 64px; overflow: visible; }
.thk2 .cl { --pcd: color-mix(in srgb, var(--pc) 68%, var(--cloudmix)); position: absolute; top: 0; display: block; width: 118px; aspect-ratio: 709 / 450; padding: 0; border: 0; background: none; cursor: pointer; color: var(--pcd); }
.thk2 .cl.a { left: 0; --pc: var(--p1); } .thk2 .cl.b { right: 0; --pc: var(--todo); }
.thk2.back .cl.a, .thk2.back .cl.b { --pc: var(--me); }
.thk2 .cl > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.thk2 .cl.a > svg { transform: scaleX(-1); }
.thk2 .cl > span { position: absolute; left: 50%; top: 45.1%; transform: translate(-50%, -50%); font-size: 13px; font-weight: 800; line-height: 1.2; text-align: center; white-space: nowrap; font-family: var(--font); }
.thk2 .cl:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 14px; }

/* 日の詳細・一覧 */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.chipb { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer; font-weight: 700; color: var(--sub); }
.chipb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chipb.f1[aria-pressed="true"], .chipb.f2[aria-pressed="true"], .chipb.f3[aria-pressed="true"] { border-color: transparent; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; min-width: 0; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.item + .item { border-top: 1px dashed var(--line); }
.item .d { width: 44px; text-align: center; font-family: var(--head); font-weight: 800; line-height: 1.1; font-size: 1.3em; }
.item .d small { display: block; font-size: .5em; color: var(--sub); font-weight: 400; }
.item b { font-size: 1em; }
.bring { font-size: .8em; color: var(--sub); }
.cb { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--sub); background: none; padding: 0; cursor: pointer; flex: none; display: grid; place-items: center; color: #fff; }
.cb.done { background: var(--ok); border-color: var(--ok); }
.dl { font-size: .78em; font-weight: 700; padding: 0 10px; border-radius: 999px; white-space: nowrap; line-height: 1.7; }
.dl.over { background: var(--bad); color: #fff; } .dl.soon { background: var(--warn-bg); color: var(--warn); } .dl.ok { color: var(--sub); border: 1px solid var(--sub); } .dl.none { color: var(--sub); border: 1px dotted var(--sub); }
.ano { border: 1.5px dashed color-mix(in srgb, var(--p1) 70%, var(--card)); background: color-mix(in srgb, var(--p1) 6%, var(--card)); border-radius: 18px; }
.srow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.sw { display: flex; flex-wrap: wrap; gap: 8px; }
.sw button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--c); }

/* 入力 */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10,15,25,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 440px; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sheet h2 { font-size: 1.2em; }
label.f { display: grid; gap: 4px; font-weight: 700; }
label.f > span { font-size: .85em; color: var(--sub); }
input[type="text"], input[type="date"], input[type="time"], select, textarea { font: inherit; width: 100%; min-height: 48px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.icons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ib { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); font-size: .75em; font-weight: 700; color: var(--sub); cursor: pointer; }
.ib svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ib[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; z-index: 60; font-weight: 700; max-width: 90%; text-align: center; }
.banner { background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: 12px; font-size: .9em; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition-duration: .01s; } }

    return processImage(it.file, RD.rot, RD.flat).catch(function () { return it.file; }).then(function (b) {
      if (it.url) URL.revokeObjectURL(it.url); it.blob = b; it.url = URL.createObjectURL(b); rdRefresh(root);
    });
  }
  function openReader() { RD.items.forEach(function (it) { if (it.url) URL.revokeObjectURL(it.url); }); RD.items = []; go('reader'); }
  function renderReader(v) {
    var lim = S.sampleImg, fr = friends(), sname = (S.cfg && S.cfg.sheetName) || '';
    var can = !!(S.sample && lim);
    v.innerHTML = '<div class="top"><button type="button" class="nav" data-act="back" aria-label="月にもどる">‹</button><h1>写真で勤務表を入れる</h1></div><section class="card">' +
      '<div class="sub">紙を平らに置いて、真上から撮ってください。名前の列まで入れること。紙は、4つに分けて撮るのがおすすめです（左半分の上と下、右半分の上と下）。どの写真にも、名前の列が入るようにして、となりの写真と少し重なってもだいじょうぶ。' + (lim ? lim.maxCount : 4) + '枚まで。手の影は、あとでアプリがならします。</div>' +
      '<label class="f"><span>勤務表に書いてある、' + esc(mainName()) + 'の名前</span><input type="text" id="rd-name" maxlength="20" value="' + esc(sname) + '" placeholder="フルネーム（例：山口 花子）"></label>' +
      '<div class="sub">あの人：' + (fr.length ? fr.map(function (f) { return esc(f.name); }).join('・') : 'まだ登録なし') + '（この名前の行も読みます）</div>' +
      (can ? '<label class="btn ghost" for="rd-file" id="rd-lab" role="button" tabindex="0">写真を足す（撮る・選ぶ）</label><input type="file" id="rd-file" accept="image/*">' +
        '<div class="row"><div class="sub grow" id="rd-cnt">写真は、まだ選んでいません</div><button type="button" class="btn ghost small" id="rd-clear" hidden>選び直す</button></div><div class="thumbs" id="rd-th"></div>' +
        '<div class="f"><span class="sub">写真の向き（文字が横向きなら回す）</span><div class="seg" role="group" aria-label="写真の向き">' + [[0, 'そのまま'], [270, '左に回す'], [90, '右に回す']].map(function (o) { return '<button type="button" class="chipb" data-rot="' + o[0] + '" aria-pressed="' + (RD.rot === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>' +
        '<div class="f"><span class="sub">影をならす（おすすめ）</span><div class="seg" role="group" aria-label="影をならす"><button type="button" class="chipb" data-flat="1" aria-pressed="' + RD.flat + '">ならす</button><button type="button" class="chipb" data-flat="0" aria-pressed="' + !RD.flat + '">そのまま</button></div></div>' +
        '<button type="button" class="btn" id="rd-go" disabled>読み取る</button><div class="sub">読み取りには、この画面を開いている人のClaudeの利用分を使います。1〜2分かかることがあります。</div>' :
        '<div class="note">この画面では、写真の読み取りが使えません（ログインしていないか、許可されていません）。下の「例の結果で試す」で、流れだけ見られます。</div>') +
      '<button type="button" class="btn ghost" id="rd-demo">例の結果で試す（写真なし）</button><button type="button" class="btn ghost" data-act="back">やめる</button></section>';
    (function (root) {
      var nameEl = $('#rd-name', root), go = $('#rd-go', root), file = $('#rd-file', root);
      if (file) {
        nameEl.addEventListener('input', function () { rdRefresh(root); });
        $('#rd-lab', root).addEventListener('click', function () { $('#rd-cnt', root).textContent = '写真の選択を開こうとしています…'; });
        file.addEventListener('change', function () {
          var add = Array.prototype.slice.call(file.files || []).slice(0, Math.max(0, lim.maxCount - RD.items.length)); file.value = '';
          add.forEach(function (f) { var it = { file: f, blob: null, url: '' }; RD.items.push(it); rdProcess(root, it); });
          rdRefresh(root);
        });
        $('#rd-clear', root).addEventListener('click', function () { RD.items.forEach(function (it) { if (it.url) URL.revokeObjectURL(it.url); }); RD.items = []; rdRefresh(root); });
        root.addEventListener('click', function (ev) {
          var r = ev.target.closest('[data-rot]'), fl = ev.target.closest('[data-flat]');
          if (r) { RD.rot = +r.getAttribute('data-rot'); $$('[data-rot]', root).forEach(function (b) { b.setAttribute('aria-pressed', b === r); }); RD.items.forEach(function (it) { rdProcess(root, it); }); }
          if (fl) { RD.flat = fl.getAttribute('data-flat') === '1'; $$('[data-flat]', root).forEach(function (b) { b.setAttribute('aria-pressed', b === fl); }); RD.items.forEach(function (it) { rdProcess(root, it); }); }
        });
        go.addEventListener('click', function () { runReader(nameEl.value.trim()); });
        rdRefresh(root);
      }
      $('#rd-demo', root).addEventListener('click', function () { var nm = nameEl.value.trim() || 'お母さん'; showConfirm(buildPlan(demoResult(nm), nm), nm); });
    })(v);
  }
  function runReader(sheetName) {
    RD.ac = new AbortController();
    sheet('<h2>読み取り中…</h2><div class="sub" id="rd-prog">写真を送っています。1〜2分かかることがあります。</div><button type="button" class="btn ghost" id="rd-stop">やめる</button>', function (root) {
      $('#rd-stop', root).addEventListener('click', function () { if (RD.ac) RD.ac.abort(); closeSheet(); });
    });
    S.sample.json(readerPrompt(), { images: rdBlobs(), signal: RD.ac.signal, modelTier: 'complex', cache: false, onText: function (o) { var el = $('#rd-prog'); if (el) el.textContent = '読んでいます…（' + o.text.length + '文字）'; } })
      .then(function (res) {
        if (!res || !res.year || !res.month || !Array.isArray(res.rows)) throw { code: 'bad' };
        res.rows = applyAliases(res.rows);
        showConfirm(buildPlan(res, sheetName), sheetName);
      }).catch(function (e) {
        if (e && e.code === 'cancelled') return;
        var msg = e && e.code === 'rate_limited' ? '利用の上限に達しました。しばらくしてから、もう一度。' : e && e.code === 'image_rejected' ? '写真が読めませんでした。別の写真で。' : e && (e.code === 'invalid_json' || e.code === 'bad') ? '表として読めませんでした。撮り直すか、分けて撮ってみてください。' : '読み取りに失敗しました。もう一度。';
        sheet('<h2>うまくいきませんでした</h2><div>' + msg + '</div><button type="button" class="btn" id="rd-again">もどる</button>', function (root) { $('#rd-again', root).addEventListener('click', openReader); });
      });
  }
  function showConfirm(plan, sheetName) {
    var fixes = plan.fixes;
    function chipsFor(f) {
      var opts = [['off', '休み']].concat(f.me ? [1, 2, 3].map(function (n) { return ['1:' + n + ':pm', n + 'F']; }) : [1, 2, 3].map(function (n) { return ['a:' + n, '午前' + n + 'F']; }).concat([1, 2, 3].map(function (n) { return ['p:' + n, '午後' + n + 'F']; })));
      return opts;
    }
    function personCard(label, key, pp, found) {
      var mt = plan.match[key], opts = '<option value="-1"' + (mt ? '' : ' selected') + '>（表に載っていない）</option>' + plan.rowNames.map(function (n, k) { return '<option value="' + k + '"' + (mt && mt.i === k ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
      return '<div class="mcard"><div class="row"><b>' + esc(label) + '</b><span class="grow"></span><span class="tag' + (found ? ' me' : '') + '">' + (found ? pp.on + '日' : '見つかりません') + '</span></div>' +
        '<label class="f"><span class="sub">表の中のこの名前の行を読みました' + (mt && !mt.exact ? '（名前が少し違います。合っていますか？）' : '') + '</span><select data-pick="' + esc(key) + '">' + opts + '</select></label></div>';
    }
    var h = '<h2>' + plan.y + '年' + plan.m + '月 を読みました</h2><div class="sub">読んだ行 ' + plan.rows + '人分 ・ 読めなかった他の人のマス ' + plan.unread + 'か所（そこは空きにします）</div>' +
      personCard(mainName(), 'me', plan.me, plan.meFound) + plan.fr.map(function (pp, i) { return personCard(pp.name, pp.who, pp, plan.frFound[i]); }).join('');
    if (!plan.meFound) h += '<div class="note">「' + esc(sheetName) + '」という名前の行が見つかりませんでした。上のリストから、正しい行を選んでください。</div>';
    h += fixes.length ? '<h3>確認してください（' + fixes.length + 'か所）</h3><div class="sub">選ばなかったところは、今のままにします。</div>' : '<div class="sub">確認が必要なところは、ありませんでした。</div>';
    fixes.forEach(function (f, i) {
      h += '<div class="fix"><div class="row"><b>' + plan.m + '月' + f.d + '日</b><span class="sub">' + esc(f.name) + ' ・ 読めた字：「' + esc(f.raw) + '」</span></div><div class="seg" data-fixi="' + i + '">' +
        chipsFor(f).map(function (o) { return '<button type="button" class="chipb" data-v="' + o[0] + '" aria-pressed="false">' + o[1] + '</button>'; }).join('') + '</div></div>';
    });
    h += '<details class="card nmd"><summary>名前を見直す（' + plan.rowNames.length + '人）</summary><div class="sub">読み間違いは、ここで直せます。直した名前は覚えて、次の月からは自動で直します。</div>' +
      plan.rowNames.map(function (n, i) { return '<div class="nmrow"><span class="role">' + esc(plan.rowBlocks[i] || '-') + '</span><input type="text" data-nm="' + i + '" value="' + esc(n) + '" maxlength="20" aria-label="名前"></div>'; }).join('') + '</details>';
    h += '<button type="button" class="btn" id="rd-ok">この内容で入れる</button><button type="button" class="btn ghost" data-close>やめる</button>';
    sheet(h, function (root) {
      root.addEventListener('change', function (ev) {
        var sel = ev.target.closest('select[data-pick]'); if (!sel) return;
        var a = plan.args, picks = Object.assign({}, a.picks); picks[sel.getAttribute('data-pick')] = +sel.value;
        showConfirm(buildPlan(a.res, a.sheetName, a.frList, picks), a.sheetName);
      });
      root.addEventListener('click', function (ev) {
        var b = ev.target.closest('.chipb[data-v]'); if (!b) return;
        var g = b.parentNode, f = fixes[+g.getAttribute('data-fixi')], v = b.getAttribute('data-v');
        f.sel = v === 'off' ? null : v.charAt(0) === '1' ? { floor: +v.split(':')[1], slot: 'pm' } : { floor: +v.split(':')[1], slot: v.charAt(0) === 'a' ? 'am' : 'pm' };
        Array.prototype.forEach.call(g.children, function (c) { c.setAttribute('aria-pressed', c === b); });
      });
      $('#rd-ok', root).addEventListener('click', function () {
        var edits = {}, aliases = {}, any = false;
        $$('input[data-nm]', root).forEach(function (inp) {
          var i = +inp.getAttribute('data-nm'), nv = inp.value.trim();
          if (nv && nv !== plan.rowNames[i]) { edits[i] = nv; aliases[normName(plan.rowNames[i])] = nv; any = true; }
        });
        if (!any) { applyPlan(plan, sheetName); return; }
        var a = plan.args, rows2 = plan.rowsF.map(function (r, i) { return edits[i] ? Object.assign({}, r, { name: edits[i] }) : r; });
        var np = buildPlan(Object.assign({}, a.res, { rows: rows2 }), a.sheetName, a.frList, a.picks);
        np.fixes.forEach(function (nf) { plan.fixes.forEach(function (of) { if (of.who === nf.who && of.d === nf.d) nf.sel = of.sel; }); });
        applyPlan(np, sheetName, { aliases: aliases });
      });
    });
  }

  /* ============ 操作 ============ */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var tab = t.closest('[data-tab]'); if (tab) { var v = tab.getAttribute('data-tab'); if (v === 'day') go('day', { date: S.today }); else go(v); return; }
    var gt = t.closest('[data-go]'); if (gt) { flipTo(+gt.getAttribute('data-go')); return; }
    var dt = t.closest('[data-date]');
    if (dt && !t.closest('[data-event]') && (dt.classList.contains('cell') || dt.classList.contains('card'))) { go('day', { date: dt.getAttribute('data-date'), fromMonth: true }); return; }
    var sf = t.closest('[data-shift]');
    if (sf) {
      var person = sf.getAttribute('data-shift'), floor = +sf.getAttribute('data-floor'), slot = person === 'me' ? 'pm' : sf.getAttribute('data-slot'), id = person + '_' + S.sel;
      var p = floor ? put('shifts', id, { person: person, date: S.sel, slot: slot, floor: floor }) : del('shifts', id);
      safe(p).then(function (ok) { if (ok) logIt(fmtDate(S.sel) + 'の勤務を' + (floor ? '入れた' : 'なしにした') + (person === 'me' ? '' : '（' + ((friends().filter(function (f) { return f.id === person; })[0] || {}).name || '') + '）')); });
      return;
    }
    var ev = t.closest('[data-event]'); if (ev) { openEvent(ev.getAttribute('data-event')); return; }
    var dn = t.closest('[data-done]'); if (dn) { completeTodo(dn.getAttribute('data-done')); return; }
    var td = t.closest('[data-todo]'); if (td) { openTodo(td.getAttribute('data-todo')); return; }
    var fr = t.closest('[data-friend]'); if (fr) { openFriend(+fr.getAttribute('data-friend')); return; }
    var evf = t.closest('[data-evf]'); if (evf) { S.evFilter = evf.getAttribute('data-evf'); render(); return; }
    var tdf = t.closest('[data-tdf]'); if (tdf) { S.tdFilter = tdf.getAttribute('data-tdf'); render(); return; }
    var mc = t.closest('[data-mecolor]'); if (mc) { saveCfg({ meColor: +mc.getAttribute('data-mecolor') }); return; }
    var th = t.closest('[data-th]'); if (th) { ls.set('theme', th.getAttribute('data-th')); applyTheme(); render(); return; }
    var fs = t.closest('[data-fs]'); if (fs) { ls.set('fs', fs.getAttribute('data-fs')); document.documentElement.style.setProperty('--fs', fs.getAttribute('data-fs') + 'px'); render(); return; }
    var a = t.closest('[data-act]'); if (!a) return;
    var act = a.getAttribute('data-act');
    if (act === 'prev') shiftMonth(-1);
    else if (act === 'next') shiftMonth(1);
    else if (act === 'back') go('month');
    else if (act === 'dprev') { S.sel = addDays(S.sel, -1); render(); }
    else if (act === 'dnext') { S.sel = addDays(S.sel, 1); render(); }
    else if (act === 'newevent') openEvent(null, a.getAttribute('data-date'));
    else if (act === 'newtodo') openTodo(null, a.getAttribute('data-date'));
    else if (act === 'newfriend') openFriend(null);
    else if (act === 'reader') openReader();
    else if (act === 'settings') go('share');
    else if (act === 'toggledone') { S.showDone = !S.showDone; render(); }
    else if (act === 'export') exportAll();
    else if (act === 'seed') seedExample();
    else if (act === 'unseed') unseed();
    else if (act === 'iammain') { saveCfg({ mainId: S.myId || '' }).then(function (ok) { if (ok) toast('この端末の人を、メインにしました'); }); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'imp' && e.target.files && e.target.files[0]) importAll(e.target.files[0]);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'mname') { clearTimeout(S.mt); var v = e.target.value; S.mt = setTimeout(function () { saveCfg({ mainName: v.trim() || 'お母さん' }); }, 700); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('label.btn[for]')) { e.preventDefault(); var f = document.getElementById(e.target.getAttribute('for')); if (f) f.click(); }
  });
  // 看板のスワイプ
  var x0 = null;
  document.addEventListener('pointerdown', function (e) { x0 = e.target.closest && e.target.closest('#stage') ? e.clientX : null; });
  document.addEventListener('pointerup', function (e) {
    if (x0 === null) return; var dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 50 && S.view === 'month') flipTo(S.page === 0 ? (dx < 0 ? 2 : 1) : 0);
  });

  /* ============ はじまり ============ */
  function start(claude) {
    applyTheme();
    try { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', function () { applyTheme(); render(); }); } catch (e) { /* ignore */ }
    var fs = curFs(); if (fs !== 16) document.documentElement.style.setProperty('--fs', fs + 'px');
    var t = new Date(); S.y = t.getFullYear(); S.m = t.getMonth() + 1;
    var uses = claude && claude.use ? ['db', 'user', 'downloads', 'sample'].map(function (n) { return claude.use(n).catch(function () { return null; }); }) : [Promise.resolve(null), Promise.resolve(null), Promise.resolve(null), Promise.resolve(null)];
    Promise.all(uses).then(function (r) {
      db = r[0]; user = r[1]; downloads = r[2]; S.sample = r[3];
      if (S.sample && S.sample.limits) S.sample.limits().then(function (l) { S.sampleImg = (l && l.images) || null; }).catch(function () { /* ignore */ });
      var idp = user ? user.me().catch(function () { return null; }) : Promise.resolve(null);
      return idp.then(function (me) {
        if (me) { S.myId = me.id || null; S.myName = me.name || ''; }
        S.mem = !db || !S.myId;
        if (S.mem) { db = null; $('#banner').innerHTML = '<div class="banner" style="margin-top:12px">お試し表示です。ログインすると、記録が保存されます。</div>'; }
        applyColors();
        COLLS.forEach(watch);
        if (S.mem) seedExample();
        if (user && user.can) user.can('data.write').then(function (w) { if (w === false) { S.canWrite = false; $('#banner').innerHTML = '<div class="banner" style="margin-top:12px">この立場では、書き込めません（見るだけです）。</div>'; } }).catch(function () { /* ignore */ });
        // 更新者の名前
        if (user && user.profiles) setInterval(function () {
          var ids = {}; S.log.forEach(function (l) { if (l.who && l.who !== S.myId && !names[l.who]) ids[l.who] = 1; });
          var list = Object.keys(ids); if (!list.length) return;
          user.profiles(list).then(function (ps) { list.forEach(function (i) { if (ps[i] && ps[i].name) names[i] = ps[i].name; }); if (S.view === 'share') render(); }).catch(function () { /* ignore */ });
        }, 8000);
      });
    });
    render();
  }
  start(window.claude);
})();
</script>
